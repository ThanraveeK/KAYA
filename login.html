<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaya: {
                            bg: '#faf6eb',
                            greenLight: '#9fae9a',
                            greenDark: '#7b8a76',
                            gradStart: '#9fae9a',
                            gradEnd: '#607d63',
                            yellow: '#eddea2',
                            gray: '#d9d9d9',
                            grayDark: '#a6a6a6'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-kaya-bg text-gray-800 font-sans antialiased selection:bg-kaya-greenLight selection:text-white min-h-screen flex items-center justify-center p-6">

    <div class="bg-white/90 backdrop-blur-md p-10 rounded-[2.5rem] shadow-2xl shadow-kaya-greenDark/40 w-full max-w-md text-center border border-white">
        <div class="mb-8 flex flex-col items-center">
            <h1 class="text-6xl font-serif font-bold tracking-[0.15em] text-transparent bg-clip-text bg-gradient-to-r from-kaya-gradStart to-kaya-gradEnd drop-shadow-sm leading-none">KAYA</h1>
            <p class="text-[11px] text-kaya-greenLight font-bold mt-1 mb-8">AI-Assisted Rusie Dutton Therapy</p>
            <h2 class="text-3xl font-serif font-bold text-kaya-greenDark mb-2 mt-2">Welcome Back</h2>
            <p class="text-gray-500 text-sm font-medium">Enter your details to continue your wellness journey</p>
        </div>

        <form class="flex flex-col gap-4 mb-6">
            <input type="text" id="username_input" placeholder="Username" required class="w-full px-6 py-4 rounded-full bg-kaya-bg/50 border border-kaya-gray text-center text-gray-700 placeholder-kaya-grayDark focus:outline-none focus:ring-2 focus:ring-kaya-greenLight focus:bg-white transition duration-300">
            <input type="password" id="password_input" placeholder="Password" required class="w-full px-6 py-4 rounded-full bg-kaya-bg/50 border border-kaya-gray text-center text-gray-700 placeholder-kaya-grayDark focus:outline-none focus:ring-2 focus:ring-kaya-greenLight focus:bg-white transition duration-300">

            <button type="button" id="loginBtn" onclick="handleLogin()" class="w-full mt-2 inline-block bg-gradient-to-r from-kaya-gradStart to-kaya-gradEnd text-kaya-bg px-6 py-4 rounded-full hover:shadow-xl hover:-translate-y-1 transition duration-300 transform shadow-md shadow-kaya-greenDark/40 text-lg tracking-wide font-bold">
                Login
            </button>
        </form>

        <a href="forgot-password.html" class="text-kaya-grayDark hover:text-kaya-greenDark text-sm font-medium transition duration-300 mb-6 inline-block hover:underline">Forgotten password?</a>
        <div class="flex items-center justify-center gap-4 text-kaya-grayDark text-sm font-serif italic mb-6">
            <div class="h-px bg-kaya-gray w-16"></div>or
            <div class="h-px bg-kaya-gray w-16"></div>
        </div>
        <a href="create-account.html" class="w-full inline-block bg-transparent border border-kaya-gray text-kaya-grayDark px-6 py-4 rounded-full hover:bg-kaya-bg hover:text-kaya-greenDark hover:border-kaya-greenLight transition duration-300 text-lg font-medium">
            Create new account
        </a>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username_input').value;
            const pwd = document.getElementById('password_input').value;
            const btn = document.getElementById('loginBtn');

            if (user.trim() !== "" && pwd.trim() !== "") {
                btn.innerText = "Logging in...";
                btn.disabled = true;

                fetch('https://thanravee-kaya-backend.hf.space/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            username: user,
                            password: pwd
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "success") {
                            localStorage.setItem('currentUser', user);
                            window.location.href = 'dashboard.html';
                        } else {
                            alert(data.message);
                            btn.innerText = "Login";
                            btn.disabled = false;
                        }
                    }).catch(err => {
                        alert("Error connecting to server.");
                        btn.innerText = "Login";
                        btn.disabled = false;
                    });
            } else {
                alert("Please enter both username and password.");
            }
        }
    </script>
</body>

</html>
