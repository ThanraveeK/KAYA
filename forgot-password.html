<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA - Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaya: {
                            bg: '#faf6eb',
                            greenLight: '#9fae9a',
                            greenDark: '#7b8a76',
                            gradStart: '#9fae9a',
                            gradEnd: '#607d63',
                            yellow: '#eddea2',
                            gray: '#d9d9d9',
                            grayDark: '#a6a6a6'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-kaya-bg text-gray-800 font-sans antialiased selection:bg-kaya-greenLight selection:text-white min-h-screen flex items-center justify-center p-6">

    <!-- การ์ด Forgot Password -->
    <div class="bg-white/90 backdrop-blur-md p-10 rounded-[2.5rem] shadow-2xl shadow-kaya-greenDark/40 w-full max-w-md text-center border border-white">

        <!-- ส่วนหัว -->
        <div class="mb-8 flex flex-col items-center">
            <h1 class="text-6xl font-serif font-bold tracking-[0.15em] text-transparent bg-clip-text bg-gradient-to-r from-kaya-gradStart to-kaya-gradEnd drop-shadow-sm leading-none">
                KAYA
            </h1>
            <p class="text-[11px] text-kaya-greenLight font-bold mt-1 mb-6">
                AI-Assisted Rusie Dutton Therapy
            </p>

            <!-- หัวข้อหน้า Forgot Password -->
            <h2 class="text-3xl font-serif font-bold text-kaya-greenDark mb-2 mt-2">
                Forgot Password?
            </h2>
            <p class="text-gray-500 text-sm font-medium leading-relaxed">
                Enter your email address below,<br>and we'll send you a link to reset your password.
            </p>
        </div>

        <!-- ฟอร์มกรอกอีเมล -->
        <form action="set-password.html" method="GET" class="flex flex-col gap-4 mb-6">

            <input type="email" placeholder="Email address" required class="w-full px-6 py-4 rounded-full bg-kaya-bg/50 border border-kaya-gray text-center text-gray-700 placeholder-kaya-grayDark focus:outline-none focus:ring-2 focus:ring-kaya-greenLight focus:bg-white transition duration-300">

            <!-- ปุ่ม Send Reset Link (ลิงก์ไปหน้าตั้งรหัสผ่านใหม่) -->
            <a href="set-password.html" class="w-full mt-4 inline-block bg-gradient-to-r from-kaya-gradStart to-kaya-gradEnd text-kaya-bg px-6 py-4 rounded-full hover:shadow-xl hover:-translate-y-1 transition duration-300 transform shadow-md shadow-kaya-greenDark/40 text-lg tracking-wide font-bold">
                Send Reset Link
            </a>

        </form>

        <!-- ลิงก์กลับไปหน้า Login -->
        <a href="login.html" class="text-kaya-grayDark hover:text-kaya-greenDark text-sm font-medium transition duration-300 inline-block hover:underline">
            &lt; Back to Sign In
        </a>

    </div>

</body>

</html>
