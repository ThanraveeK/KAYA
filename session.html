<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KAYA - Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaya: {
                            bg: '#faf6eb',
                            greenLight: '#9fae9a',
                            greenDark: '#7b8a76',
                            yellow: '#eddea2',
                            grayDark: '#a6a6a6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-active {
            filter: drop-shadow(0 0 25px #eddea2);
            border-color: #eddea2 !important;
        }
    </style>
</head>

<body class="bg-kaya-bg text-gray-800 font-sans h-screen flex overflow-hidden relative">
    <aside class="w-72 bg-kaya-greenLight flex flex-col justify-between py-10 px-6 shrink-0 opacity-40">
        <div class="text-center">
            <h1 class="text-6xl font-serif font-bold text-white leading-none">KAYA</h1>
            <p class="text-[11px] text-white font-bold mt-1">AI-Assisted Rusie Dutton Therapy</p>
        </div>
    </aside>

    <div class="fixed inset-0 z-50 bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-[3.5rem] shadow-2xl p-10 flex flex-col relative overflow-hidden transition-all duration-500">
            <div id="activeSessionView" class="flex flex-col h-full w-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="sessionTitle" class="text-3xl font-bold text-kaya-greenDark">Loading...</h2>
                    <span id="timerDisplay" class="text-3xl font-bold text-kaya-grayDark">02:00</span>
                </div>
                <div class="flex-1 flex flex-col md:flex-row gap-8 mb-6 items-center">
                    <div class="flex-1 flex flex-col items-center justify-center relative w-full h-full">
                        <div id="breathingLabel" class="text-xl font-bold text-kaya-greenDark mb-6 uppercase tracking-widest">GET READY</div>
                        <div id="breathingCircle" class="w-64 h-64 rounded-full border-[14px] border-kaya-grayDark transition-all duration-[1000ms] bg-transparent mb-6"></div>
                        <div class="flex items-center gap-2">
                            <span class="text-kaya-grayDark text-sm font-bold uppercase">Phase Time:</span>
                            <span id="breathingTimerDisplay" class="text-3xl font-bold text-kaya-greenDark">10</span>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center relative w-full h-full">
                        <div class="w-full text-center mb-3"><span id="postureStatusTop" class="text-sm font-bold text-kaya-grayDark uppercase">EVALUATING...</span></div>
                        <div class="w-full h-[70%] rounded-[2.5rem] bg-gray-100 overflow-hidden relative shadow-inner border border-gray-200">
                            <img id="webcamVideo" class="absolute inset-0 w-full h-full object-cover">
                        </div>
                    </div>
                </div>
                <div class="flex justify-center"><a href="stretch.html" class="bg-kaya-greenDark text-white px-16 py-3 rounded-2xl text-xl font-bold">Exit</a></div>
            </div>
            <div id="successSessionView" class="hidden flex-col items-center justify-center h-full w-full text-center">
                <h2 class="text-5xl font-serif font-bold text-kaya-greenDark mb-4">Therapy Complete!</h2>
                <a href="dashboard.html" class="bg-kaya-greenDark text-white px-12 py-4 rounded-2xl text-xl font-bold mt-8">Return to Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionType = urlParams.get('type') || 'neck';
        document.getElementById('sessionTitle').innerText = sessionType === 'back' ? "Back & Spine Relief" : "Neck & Shoulder Relief";

        let isPrep = true,
            prepTime = 10;
        const timerDisplay = document.getElementById('timerDisplay'),
            bLabel = document.getElementById('breathingLabel'),
            bCircle = document.getElementById('breathingCircle'),
            bTimer = document.getElementById('breathingTimerDisplay'),
            statusTop = document.getElementById('postureStatusTop');

        // ระบบกล้อง
        const hiddenVideo = document.createElement('video');
        hiddenVideo.autoplay = true;
        hiddenVideo.playsInline = true; // เพิ่มเล่นในตัว
        hiddenVideo.muted = true; // เพิ่มปิดเสียง
        const hiddenCanvas = document.createElement('canvas');
        const ctx = hiddenCanvas.getContext('2d');
        const displayImg = document.getElementById('webcamVideo');

        navigator.mediaDevices.getUserMedia({
                video: true
            })
            .then(stream => {
                hiddenVideo.srcObject = stream;
                hiddenVideo.play(); // บังคับเล่น
            })
            .catch(err => alert("Camera Error: " + err.message + "\nโปรดตรวจสอบว่าเปิดเว็บผ่าน HTTPS หรือ Vercel หรือยัง"));

        const prepLoop = setInterval(() => {
            if (isPrep) {
                prepTime--;
                bTimer.innerText = prepTime;
                if (prepTime <= 0) {
                    isPrep = false;
                    clearInterval(prepLoop);
                    fetch('https://kaya-47w7.onrender.com/api/start_pose', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            type: sessionType
                        })
                    });
                    startSync();
                }
            }
        }, 1000);

        function startSync() {
            setInterval(() => {
                if (hiddenVideo.readyState >= 2) {
                    hiddenCanvas.width = 640;
                    hiddenCanvas.height = 480;
                    ctx.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                    const base64Image = hiddenCanvas.toDataURL('image/jpeg', 0.5);

                    fetch('https://kaya-47w7.onrender.com/api/process_frame', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                image: base64Image
                            })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.image) displayImg.src = data.image;

                            if (data.is_complete) {
                                document.getElementById('activeSessionView').classList.add('hidden');
                                document.getElementById('successSessionView').classList.replace('hidden', 'flex');
                                return;
                            }
                            if (data.total_time !== undefined) {
                                let min = Math.floor(data.total_time / 60),
                                    sec = data.total_time % 60;
                                timerDisplay.innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                            }
                            bLabel.innerText = data.breathing || "IDLE";
                            bTimer.innerText = data.time_left || 0;

                            if (data.breathing === "PAUSED") {
                                bCircle.className = "w-64 h-64 rounded-full border-[14px] border-kaya-grayDark bg-transparent mb-6";
                                bCircle.classList.remove('glow-active');
                            } else if (data.breathing === "INHALE") {
                                bCircle.className = "w-64 h-64 rounded-full border-[14px] border-kaya-greenLight bg-transparent mb-6 scale-110";
                                bCircle.classList.remove('glow-active');
                            } else if (data.breathing === "HOLD") {
                                if (data.pose_msg === "PERFECT!") bCircle.classList.add('glow-active');
                                else bCircle.classList.remove('glow-active');
                            } else if (data.breathing === "EXHALE") {
                                bCircle.className = "w-64 h-64 rounded-full border-[14px] border-kaya-greenDark bg-transparent mb-6 scale-90";
                                bCircle.classList.remove('glow-active');
                            }

                            if (data.instruction) {
                                statusTop.innerText = data.instruction + (data.pose_msg === "PERFECT!" ? " (PERFECT)" : (data.pose_msg === "STAY IN FRAME TO RESUME" ? "" : " (ADJUST POSE)"));
                                statusTop.className = `text-sm font-bold uppercase ${data.pose_msg === 'PERFECT!' ? 'text-kaya-greenDark' : (data.pose_msg && data.pose_msg.includes('FRAME') ? 'text-kaya-grayDark' : 'text-red-500')}`;
                            }
                        }).catch(e => console.log("Connection delay"));
                }
            }, 250);
        }
    </script>
</body>

</html>
