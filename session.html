<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KAYA - Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaya: {
                            bg: '#faf6eb',
                            greenLight: '#9fae9a',
                            greenDark: '#7b8a76',
                            yellow: '#eddea2',
                            grayDark: '#a6a6a6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-active {
            filter: drop-shadow(0 0 25px #eddea2);
            border-color: #eddea2 !important;
        }
    </style>
</head>

<body class="bg-kaya-bg text-gray-800 font-sans h-screen flex overflow-hidden relative">
    <aside class="w-72 bg-kaya-greenLight flex flex-col justify-between py-10 px-6 shrink-0 opacity-40">
        <div class="text-center">
            <h1 class="text-6xl font-serif font-bold text-white leading-none">KAYA</h1>
            <p class="text-[11px] text-white font-bold mt-1">AI-Assisted Rusie Dutton Therapy</p>
        </div>
    </aside>

    <div class="fixed inset-0 z-50 bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-[3.5rem] shadow-2xl p-10 flex flex-col relative overflow-hidden transition-all duration-500">
            <div id="activeSessionView" class="flex flex-col h-full w-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="sessionTitle" class="text-3xl font-bold text-kaya-greenDark">Loading...</h2>
                    <span id="timerDisplay" class="text-3xl font-bold text-kaya-grayDark">02:00</span>
                </div>
                <div class="flex-1 flex flex-col md:flex-row gap-8 mb-6 items-center">

                    <div class="flex-1 flex flex-col items-center justify-center relative w-full h-full">
                        <div id="breathingLabel" class="text-xl font-bold text-kaya-greenDark mb-6 uppercase tracking-widest">GET READY</div>

                        <div class="relative w-64 h-64 flex items-center justify-center mb-6">
                            <div id="breathingCircle" class="absolute inset-0 w-full h-full rounded-full border-[14px] border-kaya-grayDark transition-all duration-[1000ms] bg-transparent"></div>
                            <img id="poseImage" src="pic/stretch1.png" class="w-32 h-32 object-contain z-10 transition-opacity duration-300">
                        </div>

                        <div class="flex items-center gap-2">
                            <span class="text-kaya-grayDark text-sm font-bold uppercase">Phase Time:</span>
                            <span id="breathingTimerDisplay" class="text-3xl font-bold text-kaya-greenDark">10</span>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col items-center justify-center relative w-full h-full">
                        <div class="w-full text-center mb-3"><span id="postureStatusTop" class="text-sm font-bold text-kaya-grayDark uppercase">EVALUATING...</span></div>
                        <div class="w-full h-[70%] rounded-[2.5rem] bg-gray-100 overflow-hidden relative shadow-inner border border-gray-200">
                            <canvas id="outputCanvas" class="w-full h-full object-cover"></canvas>
                        </div>
                    </div>
                </div>
                <div class="flex justify-center"><a href="stretch.html" class="bg-kaya-greenDark text-white px-16 py-3 rounded-2xl text-xl font-bold">Exit</a></div>
            </div>
            <div id="successSessionView" class="hidden flex-col items-center justify-center h-full w-full text-center">
                <h2 class="text-5xl font-serif font-bold text-kaya-greenDark mb-4">Therapy Complete!</h2>
                <a href="dashboard.html" class="bg-kaya-greenDark text-white px-12 py-4 rounded-2xl text-xl font-bold mt-8">Return to Dashboard</a>
            </div>
        </div>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted class="hidden"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionType = urlParams.get('type') || 'neck';
        const poseImg = document.getElementById('poseImage');

        if (sessionType === 'back') {
            document.getElementById('sessionTitle').innerText = "Back & Spine Relief";
            poseImg.src = "pic/back_left.png";
            poseImg.classList.add('scale-150');
        } else {
            document.getElementById('sessionTitle').innerText = "Neck & Shoulder Relief";
            poseImg.src = "pic/clasp.png";
            poseImg.classList.remove('scale-150');
        }

        const timerDisplay = document.getElementById('timerDisplay'),
            bLabel = document.getElementById('breathingLabel'),
            bCircle = document.getElementById('breathingCircle'),
            bTimer = document.getElementById('breathingTimerDisplay'),
            statusTop = document.getElementById('postureStatusTop');

        const poseImageMap = {
            "Clasp hands at the solar plexus": "pic/clasp.png",
            "Extend arms to the LEFT": "pic/left.png",
            "Extend arms to the RIGHT": "pic/right.png",
            "Extend arms FORWARD": "pic/forward.png",
            "Extend arms UPWARD": "pic/upward.png",
            "Place hands on the CROWN": "pic/crown.png",
            "Left hand on waist, turn head fully LEFT": "pic/back_left.png",
            "Right hand on waist, turn head fully RIGHT": "pic/back_right.png",
            "Return to READY pose": "pic/ready.png"
        };

        const NECK_STEPS = [{
            step: 1,
            inst: "Clasp hands at the solar plexus",
            type: "clasp"
        }, {
            step: 2,
            inst: "Extend arms to the LEFT",
            type: "left"
        }, {
            step: 3,
            inst: "Clasp hands at the solar plexus",
            type: "clasp"
        }, {
            step: 4,
            inst: "Extend arms to the RIGHT",
            type: "right"
        }, {
            step: 5,
            inst: "Clasp hands at the solar plexus",
            type: "clasp"
        }, {
            step: 6,
            inst: "Extend arms FORWARD",
            type: "forward"
        }, {
            step: 7,
            inst: "Clasp hands at the solar plexus",
            type: "clasp"
        }, {
            step: 8,
            inst: "Extend arms UPWARD",
            type: "upward"
        }, {
            step: 9,
            inst: "Place hands on the CROWN",
            type: "crown"
        }, {
            step: 10,
            inst: "Clasp hands at the solar plexus",
            type: "clasp"
        }, ];

        const BACK_STEPS = [{
            step: 1,
            inst: "Left hand on waist, turn head fully LEFT",
            type: "back_left"
        }, {
            step: 2,
            inst: "Right hand on waist, turn head fully RIGHT",
            type: "back_right"
        }, ];

        let isPrep = true;
        let prepTime = 10;
        let sessionActive = false;

        let current_step_idx = 0;
        let current_phase = 1;
        let last_frame_time = 0;
        let elapsed_phase = 0;
        let total_session_time = 120.0;
        let is_session_complete = false;
        let current_phase2_perfect_sec = 0.0;
        let session_step_scores = [];

        const videoElement = document.getElementById('hiddenVideo');
        const canvasElement = document.getElementById('outputCanvas');
        const ctx = canvasElement.getContext('2d');

        // ฟังก์ชันวาดเป้าหมาย Hologram จำลองจาก Python OpenCV
        function drawTargetHologram(ctx, poseType, cx, cy, scale, color) {
            const pts = {};
            if (poseType === 'clasp') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [-0.6, 0.4],
                    'R_EL': [0.6, 0.4],
                    'L_WR': [-0.05, 0.4],
                    'R_WR': [0.05, 0.4]
                });
            } else if (poseType === 'left') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [-1.1, 0.1],
                    'R_EL': [0, 0.5],
                    'L_WR': [-1.4, 0],
                    'R_WR': [-1.4, 0]
                });
            } else if (poseType === 'right') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [0, 0.5],
                    'R_EL': [1.1, 0.1],
                    'L_WR': [1.4, 0],
                    'R_WR': [1.4, 0]
                });
            } else if (poseType === 'back_left') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [-0.8, 0.5],
                    'R_EL': [0.6, 0.8],
                    'L_WR': [-0.6, 0.9],
                    'R_WR': [0.6, 1.2],
                    'HEAD': [-0.2, -0.7]
                });
            } else if (poseType === 'back_right') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [-0.6, 0.8],
                    'R_EL': [0.8, 0.5],
                    'L_WR': [-0.6, 1.2],
                    'R_WR': [0.6, 0.9],
                    'HEAD': [0.2, -0.7]
                });
            } else if (poseType === 'ready') {
                Object.assign(pts, {
                    'L_SH': [-0.5, 0],
                    'R_SH': [0.5, 0],
                    'L_EL': [-0.5, 0.5],
                    'R_EL': [0.5, 0.5],
                    'L_WR': [-0.5, 1.0],
                    'R_WR': [0.5, 1.0]
                });
            }

            if (Object.keys(pts).length === 0) return;
            if (!pts['HEAD']) pts['HEAD'] = [0, -0.7];

            const px_pts = {};
            for (let k in pts) {
                px_pts[k] = {
                    x: cx + pts[k][0] * scale,
                    y: cy + pts[k][1] * scale
                };
            }

            ctx.lineWidth = 8;
            ctx.strokeStyle = color;
            const connections = [
                ['L_SH', 'L_EL'],
                ['L_EL', 'L_WR'],
                ['R_SH', 'R_EL'],
                ['R_EL', 'R_WR'],
                ['L_SH', 'R_SH']
            ];
            for (let pair of connections) {
                if (px_pts[pair[0]] && px_pts[pair[1]]) {
                    ctx.beginPath();
                    ctx.moveTo(px_pts[pair[0]].x, px_pts[pair[0]].y);
                    ctx.lineTo(px_pts[pair[1]].x, px_pts[pair[1]].y);
                    ctx.stroke();
                }
            }

            ctx.beginPath();
            ctx.arc(px_pts['HEAD'].x, px_pts['HEAD'].y, scale * 0.4, 0, 2 * Math.PI);
            ctx.stroke();

            for (let k in px_pts) {
                if (k !== 'HEAD') {
                    ctx.beginPath();
                    ctx.arc(px_pts[k].x, px_pts[k].y, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                }
            }
        }

        const prepLoop = setInterval(() => {
            if (isPrep) {
                prepTime--;
                bTimer.innerText = prepTime;
                if (prepTime <= 0) {
                    isPrep = false;
                    clearInterval(prepLoop);
                    sessionActive = true;
                    last_frame_time = Date.now() / 1000.0;
                }
            }
        }, 1000);

        // ====== 🧠 Frontend AI Logic (เลียนแบบ Backend 100%) ======
        function onResults(results) {
            if (!videoElement.videoWidth) return;

            if (canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            let w = canvasElement.width;
            let h = canvasElement.height;

            ctx.save();
            ctx.clearRect(0, 0, w, h);
            ctx.translate(w, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(results.image, 0, 0, w, h);

            if (!sessionActive) {
                if (results.poseLandmarks) {
                    results.poseLandmarks.forEach((lm, i) => {
                        if (i <= 10) lm.visibility = 0;
                    });
                    const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(c => c[0] > 10 && c[1] > 10);
                    drawConnectors(ctx, results.poseLandmarks, BODY_CONNECTIONS, {
                        color: '#FFFFFF',
                        lineWidth: 3
                    });
                    drawLandmarks(ctx, results.poseLandmarks, {
                        color: '#FF0000',
                        lineWidth: 2,
                        radius: 3
                    });
                }
                ctx.restore();
                return;
            }

            let lm = results.poseLandmarks;
            if (!lm) {
                statusTop.innerText = "STAY IN FRAME TO RESUME";
                statusTop.className = "text-sm font-bold uppercase text-kaya-grayDark";
                bLabel.innerText = "PAUSED";
                bCircle.className = "absolute inset-0 w-full h-full rounded-full border-[14px] transition-all duration-[1000ms] bg-transparent border-kaya-grayDark";
                bCircle.classList.remove('glow-active');
                last_frame_time = Date.now() / 1000.0;
                ctx.restore();
                return;
            }

            let nose = lm[0],
                ls = lm[11],
                rs = lm[12];
            let core_vis = Math.min(nose.visibility || 0, ls.visibility || 0, rs.visibility || 0);
            if (core_vis < 0.5) {
                statusTop.innerText = "STAY IN FRAME TO RESUME";
                statusTop.className = "text-sm font-bold uppercase text-kaya-grayDark";
                bLabel.innerText = "PAUSED";
                bCircle.className = "absolute inset-0 w-full h-full rounded-full border-[14px] transition-all duration-[1000ms] bg-transparent border-kaya-grayDark";
                bCircle.classList.remove('glow-active');
                last_frame_time = Date.now() / 1000.0;
                ctx.restore();
                return;
            }

            // ซ่อนใบหน้า & วาดกระดูกแบบ OpenCV
            results.poseLandmarks.forEach((landmark, i) => {
                if (i <= 10) landmark.visibility = 0;
            });
            const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(c => c[0] > 10 && c[1] > 10);
            drawConnectors(ctx, results.poseLandmarks, BODY_CONNECTIONS, {
                color: '#FFFFFF',
                lineWidth: 3
            });
            drawLandmarks(ctx, results.poseLandmarks, {
                color: '#FF0000',
                lineWidth: 2,
                radius: 3
            });

            let current_time = Date.now() / 1000.0;
            let dt = current_time - last_frame_time;
            last_frame_time = current_time;
            if (dt > 1.0) dt = 0;

            let seq = sessionType === "neck" ? NECK_STEPS : BACK_STEPS;
            let step_info = seq[current_step_idx % seq.length];
            let instruction_en = step_info.inst;
            let pt = step_info.type;

            total_session_time -= dt;
            elapsed_phase += dt;

            if (total_session_time <= 0 && !is_session_complete) {
                is_session_complete = true;
                document.getElementById('activeSessionView').classList.add('hidden');
                document.getElementById('successSessionView').classList.replace('hidden', 'flex');

                let user = localStorage.getItem('currentUser') || 'guest';
                let today = new Date();
                let key = `kaya_data_${user}_${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
                let localData = JSON.parse(localStorage.getItem(key)) || {
                    score: 100,
                    active_time: 0,
                    stretch: 0,
                    snooze: 0
                };
                localData.stretch += 1;

                if (session_step_scores.length > 0) {
                    let avg_acc = session_step_scores.reduce((a, b) => a + b, 0) / session_step_scores.length;
                    let bonus = (avg_acc / 100.0) * 5.0;
                    localData.score = Math.min(100.0, localData.score + bonus);
                }
                localStorage.setItem(key, JSON.stringify(localData));

                ctx.restore();
                return;
            }

            let target_breathing = "INHALE";
            if (current_phase === 1) {
                target_breathing = "INHALE";
                if (elapsed_phase >= 3) {
                    current_phase = 2;
                    elapsed_phase = 0;
                }
            } else if (current_phase === 2) {
                target_breathing = "HOLD";
                if (elapsed_phase >= 7) {
                    current_phase = 3;
                    elapsed_phase = 0;
                }
            } else if (current_phase === 3) {
                target_breathing = "EXHALE";
                if (sessionType !== "neck") {
                    pt = "ready";
                    instruction_en = "Return to READY pose";
                }
                if (elapsed_phase >= 3) {
                    let step_score = Math.min(100.0, (current_phase2_perfect_sec / 7.0) * 100.0);
                    session_step_scores.push(step_score);
                    current_phase2_perfect_sec = 0.0;
                    current_phase = 1;
                    elapsed_phase = 0;
                    current_step_idx++;
                }
            }

            let time_limit = (current_phase === 2) ? 7 : 3;
            let time_left = Math.max(0, Math.floor(time_limit - elapsed_phase));

            let is_perfect = false;
            let lw = lm[15],
                rw = lm[16],
                lh = lm[23],
                rh = lm[24];

            if (pt === "clasp") {
                if (Math.abs(lw.x - rw.x) < 0.12 && lw.y > ls.y - 0.1) is_perfect = true;
            } else if (pt === "back_left") {
                if (lw.y > ls.y && lw.y < lh.y && nose.x < (ls.x + rs.x) / 2 - 0.05) is_perfect = true;
            } else if (pt === "back_right") {
                if (rw.y > rs.y && rw.y < rh.y && nose.x > (ls.x + rs.x) / 2 + 0.05) is_perfect = true;
            } else if (pt === "ready") {
                if (lw.y > ls.y && rw.y > rs.y && Math.abs(lw.x - ls.x) < 0.15) is_perfect = true;
            } else {
                is_perfect = true;
            }

            if (current_phase === 2 && is_perfect) {
                current_phase2_perfect_sec += dt;
            }

            // คำนวณวาดเป้า Hologram สีเขียว/ส้ม แบบดั้งเดิม
            let baseline = parseFloat(localStorage.getItem('kaya_baseline_' + (localStorage.getItem('currentUser') || 'guest'))) || 0.25;
            let scale = baseline * w;
            let cx = ((ls.x + rs.x) / 2) * w;
            let cy = ((ls.y + rs.y) / 2) * h;
            let color = is_perfect ? '#00FF00' : '#FFA500'; // สีเขียว = Perfect, สีส้ม = Adjust Pose

            drawTargetHologram(ctx, pt, cx, cy, scale, color);

            // อัปเดต UI 
            let min = Math.floor(Math.max(0, total_session_time) / 60);
            let sec = Math.floor(Math.max(0, total_session_time) % 60);
            timerDisplay.innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            bLabel.innerText = target_breathing;
            bTimer.innerText = time_left;

            const baseCircleClass = "absolute inset-0 w-full h-full rounded-full border-[14px] transition-all duration-[1000ms] bg-transparent ";
            if (target_breathing === "INHALE") {
                bCircle.className = baseCircleClass + "border-kaya-greenLight scale-110";
                bCircle.classList.remove('glow-active');
            } else if (target_breathing === "HOLD") {
                if (is_perfect) {
                    bCircle.className = baseCircleClass + "border-kaya-yellow";
                    bCircle.classList.add('glow-active');
                } else {
                    bCircle.className = baseCircleClass + "border-kaya-grayDark";
                    bCircle.classList.remove('glow-active');
                }
            } else if (target_breathing === "EXHALE") {
                bCircle.className = baseCircleClass + "border-kaya-greenDark scale-90";
                bCircle.classList.remove('glow-active');
            }

            statusTop.innerText = instruction_en + (is_perfect ? " (PERFECT)" : " (ADJUST POSE)");
            statusTop.className = `text-sm font-bold uppercase ${is_perfect ? 'text-kaya-greenDark' : 'text-red-500'}`;

            if (poseImageMap[instruction_en]) {
                poseImg.src = poseImageMap[instruction_en];
            } else {
                poseImg.src = sessionType === 'back' ? "pic/stretch2.png" : "pic/stretch1.png";
            }

            ctx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
        });
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async() => {
                await pose.send({
                    image: videoElement
                });
            },
            width: 640,
            height: 480
        });

        window.addEventListener('load', () => {
            camera.start().catch(err => {
                alert("Camera Error: " + err.message);
            });
        });
    </script>
</body>

</html>
