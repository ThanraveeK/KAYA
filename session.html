<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA - Session</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaya: {
                            bg: '#faf6eb',
                            greenLight: '#9fae9a',
                            greenDark: '#7b8a76',
                            gradStart: '#9fae9a',
                            gradEnd: '#607d63',
                            yellow: '#eddea2',
                            gray: '#d9d9d9',
                            grayDark: '#a6a6a6',
                            menuLight: '#faf6eb',
                            menuDark: '#e9dfb7'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-kaya-bg text-gray-800 font-sans antialiased h-screen flex overflow-hidden relative">

    <aside class="w-72 bg-kaya-greenLight flex flex-col justify-between py-10 px-6 shrink-0 opacity-40">
        <div>
            <div class="mb-12 flex flex-col items-center text-center">
                <h1 class="text-6xl font-serif font-bold tracking-[0.15em] text-transparent bg-clip-text bg-gradient-to-r from-kaya-menuLight to-kaya-menuDark leading-none">
                    KAYA
                </h1>
                <p class="text-[11px] text-kaya-menuLight font-bold mt-1">
                    AI-Assisted Rusie Dutton Therapy
                </p>
            </div>
            <nav class="flex flex-col gap-3">
                <div class="flex items-center gap-4 bg-kaya-greenDark px-5 py-3 rounded-xl text-kaya-menuLight">
                    <span class="text-xl font-bold font-sans">Dashboard</span>
                </div>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-10 md:p-12 relative w-full opacity-40">
        <h2 class="text-4xl font-serif font-bold text-kaya-greenDark tracking-wide mb-8">
            DASHBOARD OVERVIEW
        </h2>
        <div class="bg-white rounded-[2rem] p-8 shadow-xl shadow-kaya-greenDark/10 mb-8 border border-white h-32"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
            <div class="bg-white rounded-[2.5rem] p-10 h-64 border border-white"></div>
            <div class="flex flex-col gap-6">
                <div class="bg-white rounded-[2rem] p-8 h-20 border border-white"></div>
                <div class="bg-white rounded-[2rem] p-8 h-20 border border-white"></div>
            </div>
        </div>
    </main>

    <div class="fixed inset-0 z-50 bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-6">

        <div class="bg-white w-full max-w-5xl h-[75vh] rounded-[2.5rem] shadow-2xl p-10 flex flex-col relative overflow-hidden transition-all duration-500">

            <div id="activeSessionView" class="flex flex-col h-full w-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="sessionTitle" class="text-3xl md:text-4xl font-sans font-bold text-kaya-greenDark tracking-wide">
                        Loading...
                    </h2>
                    <span id="timerDisplay" class="text-3xl md:text-4xl font-sans font-bold text-kaya-grayDark">
                        00:18
                    </span>
                </div>

                <div class="flex-1 flex flex-col md:flex-row gap-8 mb-8 min-h-0">

                    <div class="flex-1 rounded-3xl flex flex-col items-center justify-center bg-kaya-bg/40 border border-kaya-gray/30 relative shadow-sm p-6">
                        <div id="breathingLabel" class="text-2xl md:text-3xl font-sans font-bold text-kaya-greenDark mb-8 tracking-[0.2em] uppercase transition-all duration-300">
                            INHALE
                        </div>

                        <div id="breathingCircle" class="w-48 h-48 md:w-56 md:h-56 rounded-full border-[12px] border-kaya-greenLight flex items-center justify-center transition-all duration-1000 ease-in-out shadow-lg bg-white scale-110">
                            <span id="breathingTimerDisplay" class="text-6xl font-sans font-bold text-kaya-greenDark">
                                5
                            </span>
                        </div>
                    </div>

                    <div class="flex-1 rounded-3xl flex items-center justify-center bg-gray-100 overflow-hidden relative shadow-inner">
                        <img src="http://localhost:5000/video_feed" class="absolute inset-0 w-full h-full object-cover" alt="AI Session Feed">
                    </div>

                </div>

                <div class="flex justify-center shrink-0">
                    <a href="stretch.html" class="bg-kaya-greenDark text-white px-16 py-3 rounded-2xl text-xl font-bold shadow-md hover:shadow-xl hover:-translate-y-1 hover:bg-kaya-gradEnd transition duration-300">
                        Exit
                    </a>
                </div>
            </div>

            <div id="successSessionView" class="hidden flex-col items-center justify-center h-full w-full text-center animate-fade-in">
                <div class="text-kaya-greenDark mb-8 flex items-end justify-center relative">
                    <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 4a2 2 0 110 4 2 2 0 010-4zM6 10h12v2h-3v10h-2v-6h-2v6H9V12H6v-2z"></path>
                    </svg>
                    <svg class="w-16 h-16 absolute -right-6 bottom-4 bg-white rounded-full p-1 shadow-sm" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        <path stroke="white" stroke-width="2" fill="none" d="M8 12h2l1.5 -3l2 6l1.5 -3h3"></path>
                    </svg>
                </div>
                <h2 class="text-4xl font-sans font-bold text-kaya-greenDark mb-4">
                    Balance Restored
                </h2>
                <p class="text-kaya-grayDark text-lg font-medium mb-12">
                    Your posture is realigned. You're ready to conquer the day.
                </p>
                <a href="dashboard.html" class="bg-kaya-greenDark text-white px-12 py-3 rounded-2xl text-xl font-bold shadow-md hover:shadow-xl hover:-translate-y-1 hover:bg-kaya-gradEnd transition duration-300">
                    Return to work
                </a>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionType = urlParams.get('type');
        const sessionTitle = document.getElementById('sessionTitle');

        if (sessionType === 'back') {
            sessionTitle.innerText = "Back & Spine Relief";
        } else {
            sessionTitle.innerText = "Neck & Shoulder Relief";
        }

        // เริ่มจับท่าทางจาก Python API ทันทีที่โหลดหน้าเสร็จ
        window.addEventListener('load', () => {
            fetch('http://localhost:5000/api/start_pose', {
                    method: 'POST'
                })
                .catch(err => console.error("Error starting AI pose:", err));
        });

        // --- Core Logic: Timer & Breathing State ---
        let totalTimeLeft = 18;
        let breathTimer = 5;
        let breathState = 'INHALE'; // สถานะเริ่มต้น: หายใจเข้า 5 วิ -> กลั้น 8 วิ -> ออก 5 วิ

        const timerDisplay = document.getElementById('timerDisplay');
        const activeView = document.getElementById('activeSessionView');
        const successView = document.getElementById('successSessionView');

        // DOM Elements สำหรับวงล้อหายใจ
        const breathingLabel = document.getElementById('breathingLabel');
        const breathingCircle = document.getElementById('breathingCircle');
        const breathingTimerDisplay = document.getElementById('breathingTimerDisplay');

        // ฟังก์ชันช่วยอัปเดตสไตล์ของวงกลมให้ดูเนียนตา
        function updateCircleUI(scale, colorClass) {
            breathingCircle.style.transform = `scale(${scale})`;
            breathingCircle.className = `w-48 h-48 md:w-56 md:h-56 rounded-full border-[12px] ${colorClass} flex items-center justify-center transition-all duration-1000 ease-in-out shadow-lg bg-white`;
        }

        const countdown = setInterval(() => {
            totalTimeLeft--;
            breathTimer--;

            // 1. อัปเดตเวลา Session รวม
            let minutes = Math.floor(totalTimeLeft / 60);
            let seconds = totalTimeLeft % 60;
            timerDisplay.innerText = (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;

            // 2. State Machine สำหรับจังหวะหายใจ
            if (breathTimer <= 0) {
                if (breathState === 'INHALE') {
                    breathState = 'HOLD';
                    breathTimer = 8;
                    // คงขนาดวงกลมที่ขยายไว้ และเปลี่ยนสีขอบเป็นเหลืองอ่อน
                    updateCircleUI(1.1, 'border-kaya-yellow');

                } else if (breathState === 'HOLD') {
                    breathState = 'EXHALE';
                    breathTimer = 5;
                    // ย่อวงกลมลง เปลี่ยนสีขอบเป็นเขียวเข้ม
                    updateCircleUI(0.9, 'border-kaya-greenDark');

                } else if (breathState === 'EXHALE') {
                    breathState = 'INHALE';
                    breathTimer = 5;
                    // ขยายวงกลมขึ้น เปลี่ยนสีขอบกลับเป็นเขียวอ่อน
                    updateCircleUI(1.1, 'border-kaya-greenLight');
                }
            }

            // 3. แสดงผลลงบนหน้าจอ
            breathingLabel.innerText = breathState;
            breathingTimerDisplay.innerText = breathTimer;

            // 4. จบเซสชัน
            if (totalTimeLeft <= 0) {
                clearInterval(countdown);
                activeView.classList.add('hidden');
                successView.classList.remove('hidden');
                successView.classList.add('flex');
            }
        }, 1000);
    </script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

</body>

</html>
